<!doctype html>
<html lang="en" class="app-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CTZero Tracker</title>
    <script>
      // Apply the stored theme before the app mounts (dark is the default), so the page does not flash.
      try {
        if (localStorage.getItem('ctzero.theme') === 'light') document.documentElement.classList.remove('app-dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
